<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>책탐정 코난</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #4a3b52;
      --cream: #fff8e7;
      --butter: #ffe08a;
      --pink: #ffc9d4;
      --mint: #c8ebd6;
      --sky: #bfe3f5;
      --lavender: #dcd0f5;
      --font-title: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-body);
      background-color: var(--cream);
      background-image: radial-gradient(#f2dca0 1.6px, transparent 1.6px);
      background-size: 24px 24px;
    }
    .hidden { display: none !important; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 20px 18px 70px; }

    /* ---------- 상단 방명록 버튼 ---------- */
    .topbar { display: flex; justify-content: flex-end; }
    .btn-guest, .btn-back {
      font-family: var(--font-title);
      font-size: 16px;
      color: var(--ink);
      background: var(--pink);
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 8px 20px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform .12s, box-shadow .12s;
    }
    .btn-guest:hover, .btn-back:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    .btn-guest:active, .btn-back:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

    /* ---------- 머리말 ---------- */
    header { text-align: center; margin: 6px 0 28px; }
    .badge {
      width: 96px; height: 96px; margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 52px;
      background: var(--butter);
      border: 3px solid var(--ink);
      border-radius: 50%;
      box-shadow: 5px 5px 0 var(--ink);
      animation: wobble 3.2s ease-in-out infinite;
    }
    h1 {
      margin: 0;
      font-family: var(--font-title);
      font-weight: 400;
      font-size: clamp(36px, 9vw, 58px);
      line-height: 1.15;
    }
    h1 .mark { background: linear-gradient(transparent 58%, var(--butter) 58%); padding: 0 6px; }
    .sub { margin: 12px 0 0; font-size: 16px; }

    /* ---------- 검색창 ---------- */
    .search {
      display: flex; align-items: center; gap: 8px;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 6px 6px 6px 22px;
      box-shadow: 5px 5px 0 var(--ink);
    }
    .search input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      font-family: var(--font-body); font-size: 19px; color: var(--ink);
    }
    .search input::placeholder { color: #a799ad; }
    .search button {
      font-family: var(--font-title);
      font-size: 18px;
      color: var(--ink);
      background: var(--butter);
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 10px 24px;
      cursor: pointer;
      white-space: nowrap;
    }
    .search button:hover { background: #ffd35c; }
    .search button:disabled { opacity: .6; cursor: wait; }

    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 18px 0 4px; }
    .chip {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 5px 14px;
      cursor: pointer;
      transition: transform .12s;
    }
    .chip:nth-child(5n+1) { background: var(--pink); }
    .chip:nth-child(5n+2) { background: var(--mint); }
    .chip:nth-child(5n+3) { background: var(--sky); }
    .chip:nth-child(5n+4) { background: var(--lavender); }
    .chip:nth-child(5n+5) { background: var(--butter); }
    .chip:hover { transform: translateY(-2px) rotate(-2deg); }

    /* ---------- 상태 / 안내 ---------- */
    #status { text-align: center; margin: 26px 0 0; font-size: 17px; min-height: 8px; }
    #status.error { color: #b8412c; }
    #status .spin { display: inline-block; animation: bounce .8s ease-in-out infinite; }

    .notice {
      display: flex; align-items: center; gap: 12px;
      margin: 22px auto 6px; max-width: 640px;
      background: var(--mint);
      border: 3px solid var(--ink);
      border-radius: 20px;
      padding: 12px 16px;
      box-shadow: 4px 4px 0 var(--ink);
      font-size: 15px;
      line-height: 1.5;
    }
    .notice .face { font-size: 30px; flex: none; }

    /* ---------- 결과 카드 ---------- */
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 28px 24px;
      margin-top: 26px;
    }
    .book {
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 6px 6px 0 var(--ink);
      transition: transform .15s, box-shadow .15s;
      animation: pop .45s cubic-bezier(.3, 1.4, .5, 1) both;
    }
    .book:nth-child(odd) { transform: rotate(-.7deg); }
    .book:nth-child(even) { transform: rotate(.7deg); }
    .book:hover { transform: translate(-2px, -4px) rotate(0); box-shadow: 9px 10px 0 var(--ink); }

    .cover-wrap {
      display: flex; justify-content: center;
      padding: 26px 0 22px;
      border-bottom: 3px solid var(--ink);
    }
    .cover {
      position: relative;
      width: 150px; aspect-ratio: 3 / 4;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 6px 16px 16px 6px;
      overflow: hidden;
      box-shadow: 6px 6px 0 rgba(74, 59, 82, .25);
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover.gen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 14px 12px 14px 26px; }
    .cover.gen .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 16px; border-right: 3px solid var(--ink); }
    .cover.gen .emoji { font-size: 40px; margin-bottom: 8px; }
    .cover.gen .t {
      font-family: var(--font-title);
      font-size: 17px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
      word-break: keep-all;
    }

    .info { padding: 16px 18px 20px; }
    .info h3 { margin: 0 0 10px; font-family: var(--font-title); font-weight: 400; font-size: 22px; line-height: 1.3; word-break: keep-all; }
    .meta { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 6px; }
    .tag {
      flex: none;
      font-size: 12px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 1px 9px;
      background: var(--butter);
    }
    .summary { margin: 12px 0 0; font-size: 15px; line-height: 1.7; }

    /* ---------- 로딩 자리표시 ---------- */
    .skel { height: 380px; background: #fff; border: 3px dashed var(--ink); border-radius: 26px; opacity: .55; animation: pulse 1.1s ease-in-out infinite; }

    /* ---------- 방명록 ---------- */
    .guest { text-align: center; padding-top: 22vh; }
    .guest .soon {
      font-family: var(--font-title);
      font-size: clamp(40px, 10vw, 64px);
      margin: 0 0 30px;
    }

    /* ---------- 애니메이션 ---------- */
    @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.95); } to { opacity: 1; } }
    @keyframes wobble { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

    @media (max-width: 560px) {
      .search { padding-left: 16px; }
      .search input { font-size: 17px; }
      .search button { padding: 9px 16px; font-size: 16px; }
      #results { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- 메인 화면 -->
  <div id="mainView" class="wrap">
    <div class="topbar">
      <button id="guestBtn" class="btn-guest" type="button">방명록</button>
    </div>

    <header>
      <div class="badge">🕵️</div>
      <h1><span class="mark">책탐정</span> 코난</h1>
      <p class="sub">키워드 하나로 나에게 어울리는 그림책을 찾아드려요</p>
    </header>

    <form id="searchForm" class="search" autocomplete="off">
      <input id="keyword" type="text" placeholder="어떤 그림책을 찾고 있나요?" maxlength="50" required />
      <button id="searchBtn" type="submit">🔍 검색</button>
    </form>

    <div class="chips" id="chips">
      <button class="chip" type="button">우정</button>
      <button class="chip" type="button">공룡</button>
      <button class="chip" type="button">용기</button>
      <button class="chip" type="button">가족</button>
      <button class="chip" type="button">잠자리</button>
    </div>

    <div id="status" aria-live="polite"></div>
    <div id="notice" class="notice hidden"><span class="face">🕵️</span><span id="noticeText"></span></div>
    <section id="results"></section>
  </div>

  <!-- 방명록 화면 -->
  <div id="guestView" class="wrap guest hidden">
    <p class="soon">준비 중</p>
    <button id="backBtn" class="btn-back" type="button">← 돌아가기</button>
  </div>

  <script>
    const mainView = document.getElementById("mainView");
    const guestView = document.getElementById("guestView");
    const form = document.getElementById("searchForm");
    const input = document.getElementById("keyword");
    const searchBtn = document.getElementById("searchBtn");
    const statusEl = document.getElementById("status");
    const noticeEl = document.getElementById("notice");
    const noticeText = document.getElementById("noticeText");
    const resultsEl = document.getElementById("results");
    const DEFAULT_NOTICE = "AI가 고른 책이에요. 실제로 있는 책인지 한 번 확인해 보세요.";

    // ----- 화면 전환 (같은 페이지 안에서 바꿔 보여줌) -----
    document.getElementById("guestBtn").addEventListener("click", () => {
      mainView.classList.add("hidden");
      guestView.classList.remove("hidden");
      window.scrollTo(0, 0);
    });
    document.getElementById("backBtn").addEventListener("click", () => {
      guestView.classList.add("hidden");
      mainView.classList.remove("hidden");
    });

    // ----- 추천 키워드 -----
    document.getElementById("chips").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip || searchBtn.disabled) return;
      input.value = chip.textContent;
      if (form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event("submit", { cancelable: true }));
    });

    // ----- 도우미 -----
    const PALETTE = [
      ["#ffd6e0", "#f4a7bb"], ["#c8ebd6", "#8fd1ad"], ["#bfe3f5", "#85c5e6"],
      ["#ffe9a8", "#f5cb5c"], ["#dcd0f5", "#b7a3e8"], ["#ffd9bd", "#f7b07c"]
    ];
    const EMOJIS = ["🐻", "🐰", "🦊", "🐸", "🐧", "🦉", "🐘", "🐱"];

    function makeEl(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function setStatus(msg, isError, spinning) {
      statusEl.textContent = "";
      if (spinning) statusEl.appendChild(makeEl("span", "spin", "🔍"));
      if (msg) statusEl.appendChild(document.createTextNode((spinning ? " " : "") + msg));
      statusEl.classList.toggle("error", !!isError);
    }

    function showSkeleton() {
      resultsEl.innerHTML = "";
      for (let i = 0; i < 3; i++) resultsEl.appendChild(makeEl("div", "skel"));
    }

    // 표지: 이미지 주소가 있으면 이미지, 없거나 깨지면 직접 그린 표지
    function makeGeneratedCover(book, i) {
      const cover = makeEl("div", "cover gen");
      const spine = makeEl("span", "spine");
      spine.style.background = PALETTE[i % PALETTE.length][1];
      cover.appendChild(spine);
      cover.appendChild(makeEl("div", "emoji", EMOJIS[i % EMOJIS.length]));
      cover.appendChild(makeEl("div", "t", book.title || "그림책"));
      return cover;
    }

    function makeCover(book, i) {
      if (book.cover && /^https?:\/\//i.test(book.cover)) {
        const cover = makeEl("div", "cover");
        const img = document.createElement("img");
        img.alt = (book.title || "그림책") + " 표지";
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";
        img.onerror = () => cover.replaceWith(makeGeneratedCover(book, i));
        img.src = book.cover;
        cover.appendChild(img);
        return cover;
      }
      return makeGeneratedCover(book, i);
    }

    function metaRow(label, value) {
      const row = makeEl("div", "meta");
      row.appendChild(makeEl("span", "tag", label));
      row.appendChild(makeEl("span", "", value || "정보 없음"));
      return row;
    }

    function renderBook(book, i) {
      const card = makeEl("article", "book");
      card.style.animationDelay = (i * 0.07) + "s";

      const wrap = makeEl("div", "cover-wrap");
      wrap.style.background = PALETTE[i % PALETTE.length][0];
      wrap.appendChild(makeCover(book, i));

      const info = makeEl("div", "info");
      info.appendChild(makeEl("h3", "", book.title || "제목 없음"));
      info.appendChild(metaRow("저자", book.author));
      info.appendChild(metaRow("출판사", book.publisher));
      info.appendChild(makeEl("p", "summary", book.summary || "줄거리 정보가 없어요."));

      card.appendChild(wrap);
      card.appendChild(info);
      return card;
    }

    // ----- 검색 -----
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const keyword = input.value.trim();
      if (!keyword || searchBtn.disabled) return;

      noticeEl.classList.add("hidden");
      setStatus("코난이 단서를 찾는 중이에요...", false, true);
      showSkeleton();
      searchBtn.disabled = true;

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ keyword })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "검색 중 문제가 생겼어요.");

        resultsEl.innerHTML = "";
        const books = Array.isArray(data.books) ? data.books : [];
        if (books.length === 0) {
          setStatus(data.aiNote || "앗, 관련 그림책을 찾지 못했어요. 다른 키워드로 다시 해볼까요?");
          return;
        }

        setStatus("");
        // 서버가 문구를 안 보내도 항상 안내가 보이도록 기본 문구를 사용
        noticeText.textContent = data.aiNote || DEFAULT_NOTICE;
        noticeEl.classList.remove("hidden");
        books.forEach((b, i) => resultsEl.appendChild(renderBook(b, i)));
      } catch (err) {
        resultsEl.innerHTML = "";
        setStatus("😢 " + err.message, true);
      } finally {
        searchBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
